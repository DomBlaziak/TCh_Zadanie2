name: Zadanie 2 - Pipeline CI/CD dla GHCR i DockerHub

on:
  workflow_dispatch: # Umożliwia manualne uruchomienie potoku
  push:
    tags:
      - 'v*' # Automatyczny trigger po przesłaniu tagu wersji (np. v1.0.0)

jobs:
  build-and-secure:
    name: Proces budowania i weryfikacji bezpieczeństwa obrazu
    runs-on: ubuntu-latest
    
    permissions:
      contents: read     # Odczyt kodu źródłowego
      packages: write    # Publikacja obrazu w rejestrze ghcr.io
      id-token: write    # Bezpieczna autoryzacja OIDC

    steps:
      - name: Pobranie kodu źródłowego
        uses: actions/checkout@v4

      - name: Konfiguracja QEMU (Multi-arch)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Konfiguracja Buildx (BuildKit)
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          endpoint: default # Dostęp dla lokalnego skanera Scout

      - name: Logowanie do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Logowanie do DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Ekstrakcja metadanych i strategii tagowania (SemVer & SHA)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,priority=100,prefix=sha-,format=short
            type=semver,priority=200,pattern={{version}}
          flavor: |
            latest=false 

      - name: Budowanie lokalnego obrazu pod testy CVE
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false # Obraz przeznaczony wyłącznie do lokalnej analizy Scout
          load: true  # Ładowanie do lokalnego demona Docker
          tags: ghcr.io/${{ github.repository }}:test-cve
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/repozytorium_1:cache

      - name: Skanowanie obrazu pod kątem CVE (Docker Scout)
        uses: docker/scout-action@v1
        with:
          command: cve
          image: ghcr.io/${{ github.repository }}:test-cve
          only-severities: critical # Blokada potoku wyłącznie dla błędów CRITICAL
          exit-code: true

      - name: Kompilacja wieloarchitekturowa i push do GHCR (Cache MAX)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/repozytorium_1:cache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/repozytorium_1:cache,mode=max